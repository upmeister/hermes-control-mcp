name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Test suite
        run: ./scripts/test.sh

      - name: Unittest discovery
        run: python -m unittest discover -s tests -v

      - name: Compile checks
        run: |
          python -m compileall -q src
          python -m py_compile src/hermes_zcode_bridge/*.py

      - name: Diff check
        run: git diff --check

  package:
    name: build + clean installed-artifact smoke
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
          ls -lh dist/

      - name: Install wheel in a fresh venv
        run: |
          python -m venv /tmp/hermes-bridge-smoke
          /tmp/hermes-bridge-smoke/bin/python -m pip install --upgrade pip
          /tmp/hermes-bridge-smoke/bin/python -m pip install dist/*.whl
          /tmp/hermes-bridge-smoke/bin/hermes-zcode-bridge --help

      - name: Installed MCP stdio smoke
        run: |
          python scripts/installed_smoke.py \
            --entrypoint /tmp/hermes-bridge-smoke/bin/hermes-zcode-bridge
