[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-zcode-bridge"
version = "0.1.0"
description = "A small MCP stdio bridge to Hermes Agent's durable runs API"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mcp>=2.0,<3",
]

[project.scripts]
hermes-zcode-bridge = "hermes_zcode_bridge.server:main"

[tool.setuptools.packages.find]
where = ["src"]
