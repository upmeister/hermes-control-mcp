[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-control-mcp"
version = "0.2.0b2"
description = "MCP control plane for Hermes Agent durable runs and optional shared live sessions"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {file = "LICENSE"}
keywords = ["hermes-agent", "mcp", "model-context-protocol", "agents", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]
dependencies = [
  "mcp>=2.0,<3",
  "httpx>=0.28.1,<1",
  "websockets>=15,<16",
]

[project.urls]
Repository = "https://github.com/upmeister/hermes-control-mcp"
Issues = "https://github.com/upmeister/hermes-control-mcp/issues"
Documentation = "https://github.com/upmeister/hermes-control-mcp#readme"

[project.scripts]
hermes-control-mcp = "hermes_control_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
